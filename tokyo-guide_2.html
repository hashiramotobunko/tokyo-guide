<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokyo Guide — Tetsuya's Picks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a; --dark: #1a1a1a; --mid: #3a3a3a;
    --gray: #6b6b6b; --light: #b0b0b0; --line: #d8d8d8;
    --bg: #f7f6f4; --white: #ffffff;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); min-height: 100vh; }

  /* HEADER */
  header { background: var(--black); padding: 48px 48px 40px; }
  .header-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); margin-bottom: 12px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 400; color: var(--white); line-height: 1.1; }
  header h1 em { font-style: italic; color: var(--light); }
  .header-meta { margin-top: 20px; font-size: 12px; color: var(--gray); letter-spacing: 0.04em; }
  .city-tabs { display: flex; gap: 8px; margin-top: 32px; border-top: 1px solid #2a2a2a; padding-top: 24px; flex-wrap: wrap; }
  .city-tab { padding: 7px 18px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #333; color: var(--light); cursor: pointer; background: transparent; transition: all 0.15s; font-family: 'Inter', sans-serif; }
  .city-tab:hover, .city-tab.active { background: var(--white); color: var(--black); border-color: var(--white); }

  /* MAIN */
  main { max-width: 1280px; margin: 0 auto; padding: 48px 48px 80px; }
  .city-section { display: none; }
  .city-section.active { display: block; }
  .city-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .city-name { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; }
  .city-note { font-size: 12px; color: var(--gray); letter-spacing: 0.06em; }

  /* STATS */
  .stats-bar { display: flex; gap: 32px; margin-bottom: 32px; padding: 18px 24px; background: var(--white); border: 1px solid var(--line); flex-wrap: wrap; }
  .stat-item { display: flex; flex-direction: column; gap: 4px; }
  .stat-num { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); }
  #result-count { margin-left: auto; align-self: center; font-size: 11px; color: var(--gray); letter-spacing: 0.06em; }

  /* CROSS FILTER PANEL */
  .filter-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    background: var(--white);
  }
  .filter-col { padding: 20px 24px; }
  .filter-col + .filter-col { border-left: 1px solid var(--line); }
  .filter-col-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .filter-col-title { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray); }
  .clear-link { font-size: 10px; letter-spacing: 0.06em; color: var(--light); cursor: pointer; text-decoration: underline; transition: color 0.1s; }
  .clear-link:hover { color: var(--black); }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 4px 12px; font-size: 11px; letter-spacing: 0.06em;
    border: 1px solid var(--line); background: var(--bg); color: var(--mid);
    cursor: pointer; transition: all 0.1s; font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--mid); color: var(--black); }
  .chip.active { background: var(--black); color: var(--white); border-color: var(--black); }
  .chip.dimmed { opacity: 0.35; }

  /* SORT ROW */
  .sort-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .sort-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); white-space: nowrap; }
  .sort-btns { display: flex; gap: 4px; }
  .sort-btn { padding: 4px 12px; font-size: 11px; letter-spacing: 0.06em; border: 1px solid var(--line); background: var(--white); color: var(--mid); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.12s; display: flex; align-items: center; gap: 4px; }
  .sort-btn:hover { border-color: var(--mid); color: var(--black); }
  .sort-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
  .sort-btn .arr { font-size: 9px; }

  /* RESET BAR */
  .active-filters {
    display: none; align-items: center; gap: 8px; margin-bottom: 20px;
    padding: 10px 16px; background: #f0ede8; border: 1px solid var(--line);
    font-size: 11px; flex-wrap: wrap;
  }
  .active-filters.visible { display: flex; }
  .active-tag { padding: 3px 10px; background: var(--black); color: var(--white); font-size: 10px; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
  .active-tag .x { cursor: pointer; opacity: 0.6; }
  .active-tag .x:hover { opacity: 1; }
  .reset-all { margin-left: auto; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; color: var(--gray); text-decoration: underline; }
  .reset-all:hover { color: var(--black); }

  /* CONTENT */
  .group-block { margin-bottom: 36px; }
  .group-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray); margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .group-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .group-count { color: var(--light); font-size: 10px; margin-left: 4px; }

  /* GRID */
  .place-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .place-card { background: var(--white); padding: 16px 18px; display: flex; flex-direction: column; gap: 5px; transition: background 0.1s; }
  .place-card:hover { background: #fafaf8; }
  .place-name { font-size: 13px; font-weight: 500; color: var(--black); line-height: 1.3; }
  .place-en { font-size: 11px; color: var(--gray); }
  .place-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tag-area { font-size: 10px; color: var(--light); letter-spacing: 0.04em; }
  .tag-cat { font-size: 10px; color: var(--light); letter-spacing: 0.04em; }
  .place-map { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; transition: color 0.1s, border-color 0.1s; width: fit-content; }
  .place-map:hover { color: var(--black); border-color: var(--black); }
  .place-map svg { width: 10px; height: 10px; }

  /* EMPTY */
  .empty { padding: 40px 0; text-align: center; font-size: 13px; color: var(--light); letter-spacing: 0.04em; }

  footer { text-align: center; padding: 32px; font-size: 11px; color: var(--light); border-top: 1px solid var(--line); letter-spacing: 0.06em; }

  @media (max-width: 700px) {
    header { padding: 32px 20px 28px; }
    header h1 { font-size: 28px; }
    main { padding: 28px 16px 60px; }
    .filter-panel { grid-template-columns: 1fr; }
    .filter-col + .filter-col { border-left: none; border-top: 1px solid var(--line); }
    .place-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

// ============================================================
// HELPERS
// ============================================================
const uniq = (arr) => [...new Set(arr)].sort();
const mapIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

// STATE per city
const STATE = {};

// ============================================================
// RENDER CARD
// ============================================================
function card(p) {
  return `<div class="place-card">
    <div class="place-name">${p.name}</div>
    ${p.en ? `<div class="place-en">${p.en}</div>` : ''}
    <div class="place-tags">
      <span class="tag-area">📍 ${p.area}</span>
      <span class="tag-cat">· ${p.cat}</span>
    </div>
    <a class="place-map" href="${p.url}" target="_blank">${mapIcon} Open in Maps</a>
  </div>`;
}

// ============================================================
// RENDER CONTENT (grouped by sort key)
// ============================================================
function renderContent(places, sort, dir) {
  if (!places.length) return `<div class="empty">No places match the selected filters.</div>`;

  const mul = dir === 'asc' ? 1 : -1;

  if (sort === 'area') {
    const areas = uniq(places.map(p => p.area));
    if (dir === 'desc') areas.reverse();
    return areas.map(area => {
      const ps = places.filter(p => p.area === area).sort((a,b) => a.name.localeCompare(b.name,'ja'));
      return `<div class="group-block">
        <div class="group-label">📍 ${area} <span class="group-count">${ps.length}</span></div>
        <div class="place-grid">${ps.map(card).join('')}</div>
      </div>`;
    }).join('');
  }

  if (sort === 'cat') {
    const cats = uniq(places.map(p => p.cat));
    if (dir === 'desc') cats.reverse();
    return cats.map(cat => {
      const ps = places.filter(p => p.cat === cat).sort((a,b) => a.name.localeCompare(b.name,'ja'));
      return `<div class="group-block">
        <div class="group-label">${cat} <span class="group-count">${ps.length}</span></div>
        <div class="place-grid">${ps.map(card).join('')}</div>
      </div>`;
    }).join('');
  }

  // sort=name — flat
  const sorted = [...places].sort((a,b) => mul * a.name.localeCompare(b.name,'ja'));
  return `<div class="place-grid">${sorted.map(card).join('')}</div>`;
}

// ============================================================
// ACTIVE FILTER TAGS RENDER
// ============================================================
function renderActiveTags(cityKey, el) {
  const s = STATE[cityKey];
  const tags = [];
  if (s.cats.length) s.cats.forEach(c => tags.push({ label: c, type: 'cat', val: c }));
  if (s.areas.length) s.areas.forEach(a => tags.push({ label: `📍 ${a}`, type: 'area', val: a }));

  if (!tags.length) { el.classList.remove('visible'); return; }
  el.classList.add('visible');
  el.innerHTML = tags.map(t =>
    `<span class="active-tag">${t.label} <span class="x" data-type="${t.type}" data-val="${t.val}">✕</span></span>`
  ).join('') + `<span class="reset-all">Reset all</span>`;
}

// ============================================================
// MAIN FILTER + RENDER ENGINE
// ============================================================
function applyFilters(cityKey, places, els) {
  const s = STATE[cityKey];
  let filtered = places;
  if (s.cats.length)  filtered = filtered.filter(p => s.cats.includes(p.cat));
  if (s.areas.length) filtered = filtered.filter(p => s.areas.includes(p.area));

  // Update result count in stats bar
  els.countEl.textContent = `Showing ${filtered.length} of ${places.length}`;

  // Re-dim chips
  updateDimming(cityKey, places, filtered, els);

  els.contentEl.innerHTML = renderContent(filtered, s.sort, s.dir);
  renderActiveTags(cityKey, els.activeTagsEl);
}

function updateDimming(cityKey, allPlaces, filtered, els) {
  const s = STATE[cityKey];

  // Cat chips: dim if no result would survive adding this cat to current area filter
  els.catChips.forEach(ch => {
    const val = ch.dataset.val;
    const active = s.cats.includes(val);
    ch.classList.toggle('active', active);
    if (active) { ch.classList.remove('dimmed'); return; }
    // Would any place survive?
    const testCats = [...s.cats, val];
    const survives = allPlaces.some(p => testCats.includes(p.cat) && (s.areas.length === 0 || s.areas.includes(p.area)));
    ch.classList.toggle('dimmed', !survives);
  });

  // Area chips: dim if no result would survive adding this area to current cat filter
  els.areaChips.forEach(ch => {
    const val = ch.dataset.val;
    const active = s.areas.includes(val);
    ch.classList.toggle('active', active);
    if (active) { ch.classList.remove('dimmed'); return; }
    const testAreas = [...s.areas, val];
    const survives = allPlaces.some(p => testAreas.includes(p.area) && (s.cats.length === 0 || s.cats.includes(p.cat)));
    ch.classList.toggle('dimmed', !survives);
  });
}

// ============================================================
// BUILD SECTIONS
// ============================================================
const cityTabsEl = document.getElementById('cityTabs');
const mainEl = document.getElementById('mainContent');

Object.keys(DATA).forEach((city, idx) => {
  const { note, places } = DATA[city];
  const key = city;

  STATE[key] = { cats: [], areas: [], sort: 'cat', dir: 'asc' };

  // Tab
  const tab = document.createElement('button');
  tab.className = 'city-tab' + (idx === 0 ? ' active' : '');
  tab.textContent = city;
  tab.dataset.city = city;
  cityTabsEl.appendChild(tab);

  // Section
  const sid = 'sec-' + idx;
  const allCats  = uniq(places.map(p => p.cat));
  const allAreas = uniq(places.map(p => p.area));

  const sec = document.createElement('div');
  sec.className = 'city-section' + (idx === 0 ? ' active' : '');
  sec.id = sid;
  sec.innerHTML = `
    <div class="city-header">
      <div class="city-name">${city}</div>
      <div class="city-note">${note}</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num">${places.length}</div><div class="stat-label">Places</div></div>
      <div class="stat-item"><div class="stat-num">${allCats.length}</div><div class="stat-label">Categories</div></div>
      <div class="stat-item"><div class="stat-num">${allAreas.length}</div><div class="stat-label">Neighbourhoods</div></div>
      <div id="count-${idx}" style="margin-left:auto;align-self:center;font-size:11px;color:var(--gray);letter-spacing:0.06em;">Showing ${places.length} of ${places.length}</div>
    </div>

    <!-- CROSS FILTER PANEL -->
    <div class="filter-panel">
      <div class="filter-col">
        <div class="filter-col-header">
          <span class="filter-col-title">Genre / Category</span>
          <span class="clear-link" id="clear-cat-${idx}">Clear</span>
        </div>
        <div class="filter-chips" id="cat-chips-${idx}">
          ${allCats.map(c => `<button class="chip" data-val="${c}" data-type="cat">${c}</button>`).join('')}
        </div>
      </div>
      <div class="filter-col">
        <div class="filter-col-header">
          <span class="filter-col-title">Neighbourhood / Area</span>
          <span class="clear-link" id="clear-area-${idx}">Clear</span>
        </div>
        <div class="filter-chips" id="area-chips-${idx}">
          ${allAreas.map(a => `<button class="chip" data-val="${a}" data-type="area">📍 ${a}</button>`).join('')}
        </div>
      </div>
    </div>

    <!-- ACTIVE FILTER TAGS -->
    <div class="active-filters" id="active-tags-${idx}"></div>

    <!-- SORT ROW -->
    <div class="sort-row">
      <span class="sort-label">Group by</span>
      <div class="sort-btns" id="sort-${idx}">
        <button class="sort-btn active" data-sort="cat">Category <span class="arr">↕</span></button>
        <button class="sort-btn" data-sort="area">Neighbourhood <span class="arr">↕</span></button>
        <button class="sort-btn" data-sort="name">Name <span class="arr">↕</span></button>
      </div>
    </div>

    <div id="content-${idx}"></div>
  `;
  mainEl.appendChild(sec);

  // DOM refs
  const els = {
    contentEl:    sec.querySelector(`#content-${idx}`),
    countEl:      sec.querySelector(`#count-${idx}`),
    activeTagsEl: sec.querySelector(`#active-tags-${idx}`),
    catChips:     [...sec.querySelectorAll(`#cat-chips-${idx} .chip`)],
    areaChips:    [...sec.querySelectorAll(`#area-chips-${idx} .chip`)],
    sortBtns:     [...sec.querySelectorAll(`#sort-${idx} .sort-btn`)],
  };

  // Initial render
  applyFilters(key, places, els);

  // --- CAT CHIPS ---
  sec.querySelector(`#cat-chips-${idx}`).addEventListener('click', e => {
    const ch = e.target.closest('.chip');
    if (!ch || ch.classList.contains('dimmed')) return;
    const val = ch.dataset.val;
    const s = STATE[key];
    if (s.cats.includes(val)) s.cats = s.cats.filter(v => v !== val);
    else s.cats.push(val);
    applyFilters(key, places, els);
  });

  // --- AREA CHIPS ---
  sec.querySelector(`#area-chips-${idx}`).addEventListener('click', e => {
    const ch = e.target.closest('.chip');
    if (!ch || ch.classList.contains('dimmed')) return;
    const val = ch.dataset.val;
    const s = STATE[key];
    if (s.areas.includes(val)) s.areas = s.areas.filter(v => v !== val);
    else s.areas.push(val);
    applyFilters(key, places, els);
  });

  // --- CLEAR BUTTONS ---
  sec.querySelector(`#clear-cat-${idx}`).addEventListener('click', () => {
    STATE[key].cats = [];
    applyFilters(key, places, els);
  });
  sec.querySelector(`#clear-area-${idx}`).addEventListener('click', () => {
    STATE[key].areas = [];
    applyFilters(key, places, els);
  });

  // --- ACTIVE TAGS (remove / reset all) ---
  sec.querySelector(`#active-tags-${idx}`).addEventListener('click', e => {
    const x = e.target.closest('.x');
    const reset = e.target.closest('.reset-all');
    const s = STATE[key];
    if (x) {
      if (x.dataset.type === 'cat')  s.cats  = s.cats.filter(v => v !== x.dataset.val);
      if (x.dataset.type === 'area') s.areas = s.areas.filter(v => v !== x.dataset.val);
      applyFilters(key, places, els);
    }
    if (reset) {
      s.cats = []; s.areas = [];
      applyFilters(key, places, els);
    }
  });

  // --- SORT ---
  sec.querySelector(`#sort-${idx}`).addEventListener('click', e => {
    const btn = e.target.closest('.sort-btn');
    if (!btn) return;
    const s = STATE[key];
    const newSort = btn.dataset.sort;
    if (s.sort === newSort) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
    else { s.sort = newSort; s.dir = 'asc'; }
    els.sortBtns.forEach(b => {
      const active = b.dataset.sort === s.sort;
      b.classList.toggle('active', active);
      b.querySelector('.arr').textContent = active ? (s.dir === 'asc' ? '↑' : '↓') : '↕';
    });
    applyFilters(key, places, els);
  });
});

// City tab switching
cityTabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.city-tab');
  if (!tab) return;
  document.querySelectorAll('.city-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.city-section').forEach(s => s.classList.remove('active'));
  tab.classList.add('active');
  const idx = [...cityTabsEl.children].indexOf(tab);
  document.getElementById('sec-' + idx).classList.add('active');
});
</script>
</body>
</html>
